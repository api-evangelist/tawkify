aid: tawkify
name: Tawkify
description: >-
  Tawkify is a US personalized matchmaking service that pairs paying clients with a trained
  human matchmaker rather than offering a self-service dating app. Founded in 2012 and
  headquartered in San Francisco, the company screens and hand-selects introductions from a
  network of several million singles, arranges curated first dates, and collects structured
  feedback after each match. Packages are sold by consultation through a client experience
  specialist instead of a published price list. Tawkify operates a consumer web application at
  app.tawkify.com for onboarding, profiles and match feedback, but publishes no public API,
  developer portal, SDK or machine-readable contract of any kind; its engineering surface is
  entirely internal.
